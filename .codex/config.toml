model_provider = "openai" # openai/ollama/azure
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"

sandbox_mode = "workspace-write"
approval_policy = "on-request"
# 「代わりに承認」: 承認が必要な操作は自動レビューへ回す。
# トップレベルの設定なので、テーブル定義より前に置く。
approvals_reviewer = "auto_review"
mcp_oauth_credentials_store = "keyring"

[sandbox_workspace_write]
network_access = true

[shell_environment_policy]
exclude = ["*_API_KEY", "*_TOKEN", "*_SECRET"]

[model_providers.azure]
name = "Azure"
base_url = ""
env_key = "AZURE_OPENAI_API_KEY"

[features]
js_repl = false
memories = true

[memories]
generate_memories = true
use_memories = true

[tools]
web_search = true
view_images = true

[plugins."computer-use@openai-bundled"]
enabled = false

[plugins."chrome@openai-bundled"]
enabled = false

[plugins."browser@openai-bundled"]
enabled = false

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."dotnet@dotnet-agent-skills"]
enabled = true

[plugins."dotnet-advanced@dotnet-agent-skills"]
enabled = true

[plugins."dotnet-aspnetcore@dotnet-agent-skills"]
enabled = true

[plugins."dotnet-blazor@dotnet-agent-skills"]
enabled = true

[plugins."dotnet-data@dotnet-agent-skills"]
enabled = true

[plugins."dotnet-diag@dotnet-agent-skills"]
enabled = true

[plugins."dotnet-maui@dotnet-agent-skills"]
enabled = true

[plugins."dotnet-nuget@dotnet-agent-skills"]
enabled = true

[plugins."dotnet-test@dotnet-agent-skills"]
enabled = true

[plugins."dotnet-test-migration@dotnet-agent-skills"]
enabled = true

[plugins."dotnet-upgrade@dotnet-agent-skills"]
enabled = true

[plugins."dotnet11@dotnet-agent-skills"]
enabled = true

# Git の marketplace だけを置く。ローカルパスの marketplace
# (openai-bundled など) はマシンごとに Codex が書き込むので含めない。
[marketplaces.dotnet-agent-skills]
source_type = "git"
source = "https://github.com/dotnet/skills.git"
